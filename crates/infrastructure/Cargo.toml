[package]
name = "smaller-talk-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
yaml-rust = "0.4.5"
json5 = "0.4"
async-trait.workspace = true
serde_json.workspace = true
smaller-talk-application = { path = "../application" }
smaller-talk-domain = { path = "../domain" }
tokio = { workspace = true, features = ["process", "io-util", "time", "fs"] }
base64 = "0.22"
uuid = { workspace = true, features = ["v4"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

tempfile = "3"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["time", "process", "io-util"] }
uuid = { workspace = true, features = ["v4"] }
