[package]
name = "smaller-talk-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = { workspace = true, features = ["clock"] }
gpui.workspace = true
pulldown-cmark = "0.13"
unicode-segmentation = "1"
url = "2"
serde_json.workspace = true
smaller-talk-application = { path = "../application" }
smaller-talk-database = { path = "../database" }
smaller-talk-infrastructure = { path = "../infrastructure" }
smaller-talk-domain = { path = "../domain" }
tokio = { workspace = true, features = ["time"] }
uuid.workspace = true
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
async-trait.workspace = true
sqlx.workspace = true
tempfile = "3"
taffy = { version = "=0.9.0", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
tokio = { workspace = true, features = ["time", "test-util"] }
uuid = { workspace = true, features = ["v4"] }
